[project]
name = "booking"
version = "0.1.0"
description = "Booking and leads service: availability, held slots with email codes, calendar events, reminders and the project brief form."
requires-python = ">=3.11"
dependencies = [
  "austial>=0.6.3",
  "httpx>=0.27",
  "boto3>=1.35",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
]

# Run from source (see the README); not built as a package.
[tool.uv]
package = false
